<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>EtherKing // Console</title>
    <!-- Markdown & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style id="theme-style">
        :root {
            --header-bg: #000000;
            --header-green: #00ff41;
            --alert-red: #ff3333;
            --bg: #050505;
            --sidebar-bg: #000000;
            --term-color: #00ff41;
            --text-main: #dddddd;
            --border-main: #333333;
            --bubble-ai-bg: rgba(127, 127, 127, 0.05);
            --bubble-user-bg: rgba(0, 255, 255, 0.05);
            --user-cyan: #0ff;
            --edit-bg: #111;
            --base-font-size: 16px;

            /* Extra neon palette */
            --neon-green: #00ff41;
            --neon-cyan: #00f5ff;
            --neon-magenta: #ff00ff;
            --neon-orange: #ff6600;
            --neon-yellow: #ffff00;
            --neon-purple: #bf00ff;
            --neon-pink: #ff0080;
            --neon-blue: #0066ff;
        }
    </style>

    <style>
        @keyframes flicker {
            0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
            20%,24%,55% { opacity: 0.4; }
        }
        @keyframes scanline-move {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes glitch-shift {
            0%,90%,100% { clip-path: none; transform: none; }
            91% { clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%); transform: translateX(-4px); }
            92% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translateX(4px); }
            93% { clip-path: none; transform: none; }
        }
        @keyframes border-glow-pulse {
            0%,100% { box-shadow: 0 0 5px var(--neon-green), 0 0 10px var(--neon-green), inset 0 0 5px rgba(0,255,65,0.1); }
            33% { box-shadow: 0 0 5px var(--neon-cyan), 0 0 15px var(--neon-cyan), inset 0 0 8px rgba(0,245,255,0.1); }
            66% { box-shadow: 0 0 5px var(--neon-magenta), 0 0 20px var(--neon-magenta), inset 0 0 10px rgba(255,0,255,0.05); }
        }
        @keyframes neon-text-cycle {
            0%,100% { text-shadow: 0 0 7px var(--neon-green), 0 0 21px var(--neon-green), 0 0 42px var(--neon-green); color: var(--neon-green); }
            33% { text-shadow: 0 0 7px var(--neon-cyan), 0 0 21px var(--neon-cyan), 0 0 42px var(--neon-cyan); color: var(--neon-cyan); }
            66% { text-shadow: 0 0 7px var(--neon-magenta), 0 0 21px var(--neon-magenta); color: var(--neon-magenta); }
        }
        @keyframes dot-pulse { 0%, 100% { transform: scale(0.5); opacity: 0.3; } 50% { transform: scale(1.2); opacity: 1; } }
        @keyframes matrix-rain {
            0% { opacity: 1; transform: translateY(-20px); }
            100% { opacity: 0; transform: translateY(100px); }
        }
        @keyframes sidebar-item-in {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes msg-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes corner-pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @keyframes hue-rotate-bg {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes blink-cursor {
            0%,100% { opacity: 1; }
            50% { opacity: 0; }
        }

        * { box-sizing: border-box; }

        body {
            background-color: #020a02;
            color: var(--text-main);
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            margin: 0;
            height: 100dvh; width: 100vw; display: flex;
            overflow: hidden;
            transition: background-color 0.2s, color 0.2s;
            font-size: var(--base-font-size);
            cursor: crosshair;
        }

        /* CRT Overlay */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px),
                linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.02), rgba(0,0,255,0.03));
            z-index: 9999; pointer-events: none;
        }

        /* Scanline sweep */
        body::after {
            content: ""; display: block; position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: linear-gradient(transparent, rgba(0,255,65,0.03), transparent);
            z-index: 9998; pointer-events: none;
            animation: scanline-move 4s linear infinite;
        }

        /* ============ MATRIX BG CANVAS ============ */
        #matrix-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04; z-index: 0; pointer-events: none;
        }

        /* ============ SIDEBAR ============ */
        #sidebar {
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 280px; max-width: 85vw;
            background: linear-gradient(180deg, #000900, #000500);
            border-right: 1px solid rgba(0,255,65,0.3);
            display: flex; flex-direction: column;
            transition: transform 0.25s ease, background 0.2s;
            z-index: 2000;
            box-shadow: 4px 0 30px rgba(0,255,65,0.08);
        }
        #sidebar.hidden { transform: translateX(-100%); }

        /* Corner decorations */
        #sidebar::before, #sidebar::after {
            content: ""; position: absolute;
            width: 12px; height: 12px;
            border-color: var(--neon-green);
            border-style: solid;
        }
        #sidebar::before {
            top: 6px; left: 6px;
            border-width: 2px 0 0 2px;
            animation: corner-pulse 2s ease-in-out infinite;
        }
        #sidebar::after {
            bottom: 6px; left: 6px;
            border-width: 0 0 2px 2px;
            animation: corner-pulse 2s ease-in-out infinite 1s;
        }

        #sidebar-header {
            padding: 15px;
            border-bottom: 1px solid rgba(0,255,65,0.2);
            display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
            background: rgba(0,255,65,0.03);
            position: relative;
        }
        #sidebar-header::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
        }

        #sidebar-header span {
            color: var(--neon-green);
            font-weight: bold;
            letter-spacing: 4px;
            font-size: 0.75rem;
            font-family: 'Orbitron', monospace;
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px rgba(0,255,65,0.5);
            animation: flicker 8s infinite;
        }

        #new-chat-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 12px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            border-radius: 2px;
            font-size: 0.75rem;
            white-space: nowrap;
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 6px rgba(0,245,255,0.2), inset 0 0 6px rgba(0,245,255,0.05);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        #new-chat-btn::before {
            content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,245,255,0.2), transparent);
            transition: left 0.3s;
        }
        #new-chat-btn:hover::before { left: 100%; }
        #new-chat-btn:hover {
            background: rgba(0,245,255,0.1);
            color: #fff;
            box-shadow: 0 0 12px var(--neon-cyan), 0 0 24px rgba(0,245,255,0.3);
        }

        #sidebar-close-mobile {
            display: none;
            background: transparent; border: none;
            color: var(--neon-magenta); font-size: 1.5rem; cursor: pointer;
            text-shadow: 0 0 10px var(--neon-magenta);
        }

        #chat-list {
            flex: 1; overflow-y: auto;
            padding: 10px;
            display: flex; flex-direction: column; gap: 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,255,65,0.3) transparent;
        }
        #chat-list::-webkit-scrollbar { width: 4px; }
        #chat-list::-webkit-scrollbar-track { background: transparent; }
        #chat-list::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.3); border-radius: 2px; }

        .chat-item {
            border: 1px solid rgba(0,255,65,0.15);
            padding: 10px;
            border-radius: 2px;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            background: rgba(0,255,65,0.02);
            transition: all 0.2s;
            min-height: 44px;
            color: var(--text-main);
            animation: sidebar-item-in 0.3s ease forwards;
            position: relative;
            overflow: hidden;
        }
        .chat-item::before {
            content: "▶"; position: absolute; left: -20px;
            color: var(--neon-green); font-size: 0.6rem;
            transition: left 0.2s;
        }
        .chat-item.active {
            border-color: var(--neon-green);
            background: rgba(0,255,65,0.06);
            box-shadow: 0 0 8px rgba(0,255,65,0.15), inset 0 0 8px rgba(0,255,65,0.05);
        }
        .chat-item.active::before { left: 8px; }
        .chat-item:hover {
            background: rgba(0,255,65,0.08);
            border-color: rgba(0,255,65,0.4);
        }

        .chat-title {
            flex: 1; font-size: 0.82rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            color: inherit; padding-left: 4px;
        }
        .chat-item.active .chat-title { color: var(--neon-green); text-shadow: 0 0 6px rgba(0,255,65,0.5); }

        .chat-actions { display: flex; gap: 6px; opacity: 0.4; transition: 0.2s; }
        .chat-item:hover .chat-actions { opacity: 1; }

        .chat-action-btn {
            background: transparent;
            border: 1px solid var(--term-color);
            color: var(--term-color);
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 2px; flex-shrink: 0;
            transition: all 0.15s;
        }
        .chat-action-btn svg { width: 14px; height: 14px; fill: currentColor; }
        .chat-action-btn:hover { background: var(--term-color); color: var(--bg); box-shadow: 0 0 8px var(--term-color); }
        .chat-action-btn.btn-red { border-color: var(--alert-red); color: var(--alert-red); }
        .chat-action-btn.btn-red:hover { background: var(--alert-red); color: #fff; box-shadow: 0 0 8px var(--alert-red); }

        /* ============ MAIN APP ============ */
        #app {
            flex: 1; display: flex; flex-direction: column; min-width: 0;
            position: relative;
            transition: padding-left 0.25s ease;
            padding-left: 280px;
            z-index: 1;
        }
        #app.expanded { padding-left: 0; }

        /* ============ HEADER ============ */
        header {
            padding: 0 15px;
            border-bottom: 1px solid rgba(0,255,65,0.2);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, #000900, #000500, #000900) !important;
            z-index: 1000; flex-shrink: 0; height: 52px;
            position: relative;
            box-shadow: 0 2px 20px rgba(0,255,65,0.1);
        }
        header::after {
            content: ""; position: absolute; bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-cyan), var(--neon-green), transparent);
            animation: hue-rotate-bg 6s linear infinite;
        }

        header div { color: var(--header-green) !important; font-weight: bold; letter-spacing: 3px; }

        header button {
            background: transparent !important; color: var(--header-green) !important;
            border: 1px solid var(--header-green) !important; padding: 5px; cursor: pointer;
            font-family: 'Orbitron', monospace;
        }

        #left-header-group { display: flex; align-items: center; gap: 12px; }

        #header-title {
            font-family: 'Orbitron', monospace !important;
            font-size: 0.9rem;
            letter-spacing: 4px !important;
            animation: neon-text-cycle 9s linear infinite;
            position: relative;
        }
        #header-title::after {
            content: "█";
            font-size: 0.7rem;
            animation: blink-cursor 1s infinite;
            margin-left: 4px;
            opacity: 0.7;
        }

        /* Header status indicators */
        #header-status {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.65rem; color: rgba(0,255,65,0.6);
            font-family: 'Share Tech Mono', monospace;
        }
        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--neon-green);
            box-shadow: 0 0 6px var(--neon-green);
            animation: dot-pulse 2s infinite;
        }

        #sidebar-toggle {
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(0,255,65,0.5) !important;
            color: var(--neon-green) !important;
            background: transparent !important;
            border-radius: 2px;
            transition: all 0.2s;
            box-shadow: 0 0 6px rgba(0,255,65,0.1);
        }
        #sidebar-toggle svg { width: 18px; height: 18px; fill: currentColor; }
        #sidebar-toggle:hover {
            background: rgba(0,255,65,0.1) !important;
            box-shadow: 0 0 12px rgba(0,255,65,0.4) !important;
        }

        /* ============ CHAT BOX ============ */
        #chat-box {
            flex: 1; overflow-y: auto;
            padding: 26px 32px;
            display: flex; flex-direction: column; gap: 28px;
            width: 100%; max-width: 1100px; margin: 0 auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,255,65,0.3) transparent;
        }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.3); border-radius: 2px; }

        #app.expanded #chat-box { max-width: 1200px; }

        .msg-container { display: flex; flex-direction: column; gap: 8px; max-width: 100%; animation: msg-in 0.3s ease; }
        .msg-container.user { align-items: flex-end; }
        .msg-container.ai { align-items: flex-start; }

        .msg {
            max-width: 100%; padding: 15px;
            line-height: 1.65; position: relative;
            font-size: 1.05rem;
        }

        /* User message — cyan neon */
        .msg-user {
            text-align: right;
            border-right: 3px solid var(--neon-cyan);
            border-top: 1px solid rgba(0,245,255,0.2);
            border-bottom: 1px solid rgba(0,245,255,0.2);
            color: var(--neon-cyan);
            background: linear-gradient(135deg, rgba(0,245,255,0.04), rgba(0,245,255,0.01));
            max-width: 90%;
            white-space: pre-wrap;
            box-shadow: 4px 0 20px rgba(0,245,255,0.08), inset 0 0 20px rgba(0,245,255,0.02);
            text-shadow: 0 0 8px rgba(0,245,255,0.5);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 0px) 100%, 0 100%);
            position: relative;
        }
        .msg-user::before {
            content: "> USER://"; position: absolute; top: -1px; right: 10px;
            font-size: 0.6rem; color: rgba(0,245,255,0.4); font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        /* AI message — green neon */
        .msg-ai {
            border-left: 3px solid var(--neon-green);
            border-top: 1px solid rgba(0,255,65,0.15);
            border-bottom: 1px solid rgba(0,255,65,0.15);
            color: var(--text-main);
            background: linear-gradient(135deg, rgba(0,255,65,0.03), rgba(0,255,65,0.01));
            width: 100%;
            box-shadow: -4px 0 20px rgba(0,255,65,0.08), inset 0 0 20px rgba(0,255,65,0.02);
            position: relative;
        }
        .msg-ai::before {
            content: "AI://ETHERKING"; position: absolute; top: -1px; left: 10px;
            font-size: 0.6rem; color: rgba(0,255,65,0.4); font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        /* Corner decorations on messages */
        .msg::after {
            content: ""; position: absolute;
            bottom: 4px; right: 4px;
            width: 8px; height: 8px;
            border-bottom: 1px solid currentColor;
            border-right: 1px solid currentColor;
            opacity: 0.3;
        }

        /* 動作按鈕 */
        .msg-actions { display: flex; gap: 8px; opacity: 0.3; transition: 0.3s; margin-top: 6px; }
        .msg-actions:hover { opacity: 1; }
        .action-btn {
            background: transparent;
            border: 1px solid var(--term-color);
            color: var(--term-color);
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 2px;
            transition: all 0.15s;
        }
        .action-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .action-btn:hover { background: var(--term-color); color: var(--bg); box-shadow: 0 0 10px var(--term-color); }
        .action-btn.btn-red { border-color: var(--alert-red); color: var(--alert-red); }
        .action-btn.btn-red:hover { background: var(--alert-red); color: #fff; box-shadow: 0 0 10px var(--alert-red); }

        .edit-area {
            width: 100%; background: #060f06;
            border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 12px; font-family: 'Share Tech Mono', monospace;
            font-size: 1rem; outline: none; resize: vertical; min-height: 100px;
            box-shadow: inset 0 0 15px rgba(0,245,255,0.05), 0 0 10px rgba(0,245,255,0.1);
        }

        /* Code Block */
        .code-block {
            margin: 16px 0;
            border: 1px solid rgba(0,255,65,0.2);
            background: #0a0f0a;
            border-radius: 0;
            position: relative;
            box-shadow: 0 0 20px rgba(0,255,65,0.05);
        }
        .code-block::before {
            content: "";  position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-cyan), var(--neon-green), transparent);
        }
        .code-header {
            background: linear-gradient(90deg, #0d1a0d, #0a120a);
            padding: 8px 15px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.72rem; color: rgba(0,255,65,0.7);
            border-bottom: 1px solid rgba(0,255,65,0.15);
            position: sticky; top: 0; z-index: 10;
        }
        .code-info { display: flex; gap: 20px; font-family: 'Orbitron', monospace; font-size: 0.65rem; }
        .code-btn {
            background: rgba(0,255,65,0.05);
            border: 1px solid rgba(0,255,65,0.3);
            color: rgba(0,255,65,0.8);
            padding: 4px;
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border-radius: 2px; transition: all 0.15s;
        }
        .code-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .code-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 10px var(--neon-green); }
        .run-text-btn {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 0 12px; height: 30px;
            font-weight: bold; cursor: pointer;
            border-radius: 2px; font-size: 0.65rem;
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--neon-cyan);
            box-shadow: 0 0 6px rgba(0,245,255,0.2);
            transition: all 0.2s;
        }
        .run-text-btn:hover {
            background: rgba(0,245,255,0.1);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        pre { margin: 0; padding: 0; overflow-x: auto; }
        code { font-family: 'Share Tech Mono', 'Consolas', monospace; display: block; padding: 15px; }

        /* Table */
        .msg-ai table { border-collapse: collapse; width: 100%; margin: 15px 0; border: 1px solid rgba(0,255,65,0.2) !important; }
        .msg-ai th, .msg-ai td { border: 1px solid rgba(0,255,65,0.15) !important; padding: 10px; text-align: left; color: inherit; }
        .msg-ai th { background: rgba(0,255,65,0.05); color: var(--neon-green); text-shadow: 0 0 6px rgba(0,255,65,0.4); font-family: 'Orbitron', monospace; font-size: 0.8rem; letter-spacing: 1px; }
        .msg-ai tr:nth-child(even) td { background: rgba(0,255,65,0.02); }

        /* ============ INPUT AREA ============ */
        #input-area {
            border-top: 1px solid rgba(0,255,65,0.2);
            padding: 14px 20px;
            display: flex; gap: 12px;
            background: linear-gradient(0deg, #000900, #010d01);
            z-index: 1000; flex-shrink: 0; align-items: flex-end;
            position: relative;
        }
        #input-area::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-green), var(--neon-magenta), var(--neon-cyan), transparent);
        }

        #user-input {
            flex: 1;
            background: #050f05;
            border: 1px solid rgba(0,255,65,0.25);
            color: var(--neon-green);
            padding: 14px 16px;
            font-family: 'Share Tech Mono', monospace;
            outline: none; font-size: 1rem;
            border-radius: 2px;
            resize: none; min-height: 52px; max-height: 240px;
            overflow-y: auto; line-height: 1.5;
            transition: all 0.2s;
            box-shadow: inset 0 0 15px rgba(0,255,65,0.03);
        }
        #user-input::placeholder { color: rgba(0,255,65,0.25); font-style: italic; }
        #user-input:focus {
            border-color: rgba(0,255,65,0.6);

<script>
    /* ============================================================
       MATRIX RAIN BACKGROUND
    ============================================================ */
    (function initMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const cols = Math.floor(canvas.width / 16);
        const drops = Array.from({length: cols}, () => Math.random() * -100);
        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
        const colors = ['#00ff41','#00f5ff','#ff00ff','#ff6600','#bf00ff'];
        function drawMatrix() {
            ctx.fillStyle = 'rgba(2,10,2,0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = '14px Share Tech Mono';
            drops.forEach((y, i) => {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillText(char, i * 16, y * 16);
                if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i] += 0.5;
            });
        }
        setInterval(drawMatrix, 60);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    })();

    const params = new URLSearchParams(window.location.search); 
    const authkey = params.get('authkey');
    // --- Icons ---
    const ICON_COPY = `<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>`;
    const ICON_CHECK = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
    const ICON_EDIT = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
    const ICON_DELETE = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;
    const ICON_SEND = `<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>`;

    // --- State & Styles ---
    const stylesMap = {
        terminal: { bg: '#050505', sidebar: '#000', term: '#00ff41', text: '#dddddd', border: '#333333', bubbleAi: 'rgba(127, 127, 127, 0.05)', bubbleUser: 'rgba(0, 255, 255, 0.05)', userCyan: '#0ff', editBg: '#111' },
        dark:     { bg: '#050505', sidebar: '#0a0a0a', term: '#ffffff', text: '#ffffff', border: '#444444', bubbleAi: 'rgba(255, 255, 255, 0.1)', bubbleUser: 'rgba(255, 255, 255, 0.1)', userCyan: '#fff', editBg: '#1a1a1a' },
        gray:     { bg: '#333333', sidebar: '#222', term: '#ffffff', text: '#ffffff', border: '#ffffff', bubbleAi: 'rgba(0,0,0,0.2)', bubbleUser: 'rgba(0,0,0,0.2)', userCyan: '#fff', editBg: '#222' },
        white:    { bg: '#ffffff', sidebar: '#f5f5f5', term: '#0066ff', text: '#000000', border: '#cccccc', bubbleAi: '#f0f0f0', bubbleUser: '#eef2ff', userCyan: '#0044cc', editBg: '#f9f9f9' }
    };
    
    let currentStyle = localStorage.getItem('chatStyle') || 'terminal';
    let currentFontSize = localStorage.getItem('chatFontSize') || '16px';

    /* ============================================================
       MULTI CHAT SYSTEM
    ============================================================ */

    const CHAT_META_KEY = 'zchat:meta';
    const CHAT_PREFIX = 'zchat:';

    function randomHex(n) { return Math.floor(Math.random() * Math.pow(16, n)).toString(16).padStart(n, '0'); }
    function genChatId() { return `${randomHex(5)}-${randomHex(5)}-${randomHex(5)}-${randomHex(5)}`; }
    function loadMeta() { try { return JSON.parse(localStorage.getItem(CHAT_META_KEY)) || []; } catch { return []; } }
    function saveMeta(meta) { localStorage.setItem(CHAT_META_KEY, JSON.stringify(meta)); }
    function loadChatContent(id) { try { return JSON.parse(localStorage.getItem(CHAT_PREFIX + id)) || []; } catch { return []; } }
    function saveChatContent(id, content) { localStorage.setItem(CHAT_PREFIX + id, JSON.stringify(content)); }
    function deleteChat(id) { localStorage.removeItem(CHAT_PREFIX + id); let meta = loadMeta().filter(m => m.id !== id); saveMeta(meta); }
    function getActiveChatId() { return localStorage.getItem('zchat:active'); }
    function setActiveChatId(id) { localStorage.setItem('zchat:active', id); }
    function touchChat(id) { let meta = loadMeta(); const m = meta.find(x => x.id === id); if (m) m.lastModified = Date.now(); saveMeta(meta); }

    function createNewChat(title = 'New Chat') {
        const id = genChatId();
        const meta = loadMeta();
        meta.push({ id, title, lastModified: Date.now() });
        saveMeta(meta);
        saveChatContent(id, []);
        setActiveChatId(id);
        return id;
    }

    function ensureInitialChat() {
        let meta = loadMeta();
        if (!meta.length) return createNewChat('New Chat');
        const active = getActiveChatId();
        if (!active || !meta.find(m => m.id === active)) {
            setActiveChatId(meta.sort((a,b)=>b.lastModified-a.lastModified)[0].id);
        }
        return getActiveChatId();
    }

    let history = [];
    let isGenerating = false, isStopped = false, abortController = null, currentRunnerData = { b64: '', lang: '' };

    /* ============================================================
       DOM REFS
    ============================================================ */

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const chatListEl = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const settingsModelSelect = document.getElementById('settings-model-select');
    const settingsStyleSelect = document.getElementById('settings-style-select');
    const settingsFontSelect = document.getElementById('settings-font-select');
    const clearAllHistoryBtn = document.getElementById('clear-all-history-btn');

    let currentModel = localStorage.getItem('zchat:model') || 'gpt-5.4-mini';

    /* ============================================================
       STYLE SYSTEM
    ============================================================ */

    function applyStyle(name) {
        const s = stylesMap[name];
        if (!s) return;
        currentStyle = name;
        const root = document.documentElement;
        root.style.setProperty('--bg', s.bg);
        root.style.setProperty('--sidebar-bg', s.sidebar);
        root.style.setProperty('--term-color', s.term);
        root.style.setProperty('--text-main', s.text);
        root.style.setProperty('--border-main', s.border);
        root.style.setProperty('--bubble-ai-bg', s.bubbleAi);
        root.style.setProperty('--bubble-user-bg', s.bubbleUser);
        root.style.setProperty('--user-cyan', s.userCyan);
        root.style.setProperty('--edit-bg', s.editBg);
        
        if(name === 'white') {
            root.style.setProperty('--header-bg', '#ffffff');
            root.style.setProperty('--header-green', '#0066ff');
        } else {
            root.style.setProperty('--header-bg', '#000000');
            root.style.setProperty('--header-green', '#00ff41');
        }

        localStorage.setItem('chatStyle', name);
        if(chatBox.innerHTML !== "") loadHistory(false); 
        renderChatList();
    }

    function applyFontSize(size) {
        currentFontSize = size;
        document.documentElement.style.setProperty('--base-font-size', size);
        localStorage.setItem('chatFontSize', size);
    }

    /* ============================================================
       HELPERS
    ============================================================ */

    const getB64 = (s) => btoa(unescape(encodeURIComponent(s)));
    const fromB64 = (s) => decodeURIComponent(escape(atob(s)));
    const formatSize = (s) => { const b = new Blob([s]).size; return b < 1024 ? b + " B" : (b/1024).toFixed(2) + " KB"; };

    userInput.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px'; });
    userInput.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

    /* ============================================================
       MARKDOWN RENDERER
    ============================================================ */

    const renderer = new marked.Renderer();
    renderer.code = function({ text, lang }) {
        const validLang = (lang && hljs.getLanguage(lang)) ? lang : 'plaintext';
        const highlighted = hljs.highlight(text, { language: validLang, ignoreIllegals: true }).value;
        const b64 = getB64(text);
        const runnable = ['javascript', 'js', 'html', 'htm'].includes(validLang.toLowerCase());
        return `<div class="code-block">
            <div class="code-header">
                <div class="code-info"><strong style="color:var(--neon-cyan);text-shadow:0 0 8px var(--neon-cyan)">${validLang.toUpperCase()}</strong><span>Length: ${text.length}</span></div>
                <div class="code-actions" style="display:flex; gap:10px; align-items:center;">
                    ${runnable ? `<button class="run-text-btn" onclick="openRunner('${b64}', '${validLang.toLowerCase()}')">RUN</button>` : ''}
                    <button class="code-btn" onclick="copyCode('${b64}', this)">${ICON_COPY}</button>
                </div>
            </div>
            <pre><code class="hljs language-${validLang}">${highlighted}</code></pre>
        </div>`;
    };
    marked.setOptions({ renderer, breaks: true, gfm: true, mangle: false, headerIds: false });

    /* ============================================================
       CHAT RENDERING
    ============================================================ */

    function loadHistory(shouldScroll = true) {
        const currentPos = chatBox.scrollTop;
        chatBox.innerHTML = '';
        history.forEach((msg, i) => addMessageToUI(msg, i));
        if (shouldScroll) chatBox.scrollTop = chatBox.scrollHeight;
        else chatBox.scrollTop = currentPos;
    }

    function addMessageToUI(msg, i) {
        const container = document.createElement('div');
        container.className = `msg-container ${msg.role === 'user' ? 'user' : 'ai'}`;
        container.id = `msg-cnt-${i}`;
        const bubble = document.createElement('div');
        bubble.className = `msg msg-${msg.role === 'user' ? 'user' : 'ai'}`;
        if (msg.role === 'user') bubble.textContent = msg.content;
        else { bubble.innerHTML = marked.parse(msg.content); bubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el)); }
        
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        actions.appendChild(createIconBtn(ICON_COPY, (btn) => { 
            navigator.clipboard.writeText(msg.content);
            const original = btn.innerHTML;
            btn.innerHTML = ICON_CHECK;
            setTimeout(() => btn.innerHTML = original, 1500);
        }));
        if (msg.role === 'user') actions.appendChild(createIconBtn(ICON_EDIT, () => enterEditMode(i)));
        actions.appendChild(createIconBtn(ICON_DELETE, () => { confirmAction = () => { history.splice(i, 1); saveAndReload(); }; showPrompt("CONFIRM", "Purge this message?"); }, true));
        
        container.appendChild(bubble);
        container.appendChild(actions);
        chatBox.appendChild(container);
    }

    function createIconBtn(svg, onClick, isRed = false) {
        const btn = document.createElement('button');
        btn.className = `action-btn ${isRed ? 'btn-red' : ''}`;
        btn.innerHTML = svg;
        btn.onclick = () => onClick(btn);
        return btn;
    }

    function enterEditMode(i) {
        const bubble = document.querySelector(`#msg-cnt-${i} .msg`);
        const original = history[i].content;
        bubble.innerHTML = '';
        const area = document.createElement('textarea');
        area.className = 'edit-area'; area.value = original;
        const row = document.createElement('div');
        row.style.cssText = "display:flex; gap:10px; margin-top:10px; justify-content:flex-end;";
        row.appendChild(createIconBtn(ICON_DELETE, () => loadHistory(false), true)); 
        row.appendChild(createIconBtn(ICON_SEND, () => { const v = area.value.trim(); if(v) { history = history.slice(0, i); userInput.value = v; saveAndReload(); sendMessage(); } }));
        bubble.appendChild(area); bubble.appendChild(row); area.focus();
    }

    function saveAndReload() {
        const id = getActiveChatId();
        saveChatContent(id, history);
        touchChat(id);
        saveMeta(loadMeta());
        loadHistory();
        renderChatList();
    }

    /* ============================================================
       SEND MESSAGE & TITLE GENERATION
    ============================================================ */

    async function generateChatTitle(userMessage) {
        const chatId = getActiveChatId();
        try {
            const res = await fetch('/api/models', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    model: 'gpt-5-nano', 
                    messages: [{ role: 'user', content: `Please generate a very short, concise English title (maximum 3 words, recommand 2 words) for a chat session that starts with this message: "${userMessage}". Return ONLY the title text, nothing else.` }],
                    authkey: authkey
                })
            });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let title = "";
            while (true) {
                const { done, value } = await reader.read(); if (done) break;
                title += decoder.decode(value, { stream: true });
            }
            title = title.replace(/["']/g, "").trim();
            if (title) {
                let meta = loadMeta();
                const m = meta.find(x => x.id === chatId);
                if (m) {
                    m.title = title;
                    saveMeta(meta);
                    renderChatList();
                }
            }
        } catch (e) { console.error("Title generation failed", e); }
    }

    async function sendMessage() {
        const text = userInput.value.trim(); if (!text || isGenerating) return;
        
        const isFirstMessage = history.length === 0;
        
        isGenerating = true; isStopped = false; abortController = new AbortController();
        userInput.value = ''; userInput.style.height = '52px'; userInput.disabled = true;
        sendBtn.innerHTML = 'STOP'; sendBtn.classList.add('stop-mode');
        history.push({ role: 'user', content: text }); loadHistory();

        if (isFirstMessage) generateChatTitle(text);

        const aiBubble = document.createElement('div');
        aiBubble.className = 'msg msg-ai'; aiBubble.innerHTML = `<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        const aiCnt = document.createElement('div'); aiCnt.className = 'msg-container ai';
        aiCnt.appendChild(aiBubble); chatBox.appendChild(aiCnt); chatBox.scrollTop = chatBox.scrollHeight;

        let full = "";
        try {
            const res = await fetch('/api/models', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: currentModel, messages: history, authkey: authkey}),
                signal: abortController.signal
            });
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            while (true) {
                const { done, value } = await reader.read(); if (done) break;
                const chunk = decoder.decode(value, { stream: true });
                if (isStopped) break;
                full += chunk; aiBubble.innerHTML = marked.parse(full);
                aiBubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        } catch (e) { if (e.name !== 'AbortError' && !isStopped) aiBubble.innerHTML = `<span style="color:var(--alert-red)">[ERROR] ${e.message}</span>`; }
        finally {
            const final = isStopped ? full + "\n\n[TERMINATED BY USER]" : full;
            history.push({ role: 'assistant', content: final });
            saveAndReload();
            isGenerating = false; userInput.disabled = false; sendBtn.innerHTML = 'SEND'; sendBtn.classList.remove('stop-mode');
        }
    }

    /* ============================================================
       MODALS
    ============================================================ */

    let confirmAction = null;
    function showPrompt(title, text) { document.getElementById('modal-title').innerText = title; document.getElementById('modal-body-text').innerText = text; document.getElementById('custom-modal').style.display = 'flex'; }
    function closeAlert(confirm) { document.getElementById('custom-modal').style.display = 'none'; if(confirm && confirmAction) confirmAction(); confirmAction = null; }

    window.openRunner = function(b64, lang) { currentRunnerData = { b64, lang }; document.getElementById('runner-modal').style.display = 'flex'; executeRunner(); };
    function executeRunner() {
        const { b64, lang } = currentRunnerData;
        if(!b64) return;
        const code = fromB64(b64);
        const logArea = document.getElementById('console-log-area');
        logArea.innerHTML = `<div style="color:rgba(0,255,65,0.5)">// Executing ${lang.toUpperCase()}...</div><hr style="border:0; border-top:1px dashed rgba(0,255,65,0.3); margin:10px 0;">`;
        const bridge = `<script>
            const _l = (m, t='info') => window.parent.postMessage({ type: 'console', method: t, content: m }, '*');
            console.log = (...a) => _l(a.map(x => typeof x==='object'?JSON.stringify(x):x).join(' '), 'info');
            console.error = (...a) => _l(a.map(x => typeof x==='object'?JSON.stringify(x):x).join(' '), 'error');
        <\/script>`;
        const ifr = document.getElementById('runner-frame');
        ifr.srcdoc = (lang === 'html' || lang === 'htm') ? bridge + code : bridge + `<body style="padding:20px; font-family:sans-serif;"><h3>Sandbox Result</h3><script>${code}<\/script></body>`;
    }
    document.getElementById('modal-rerun-btn').onclick = executeRunner;

    window.addEventListener('message', (e) => {
        if (e.data.type === 'console') {
            const l = document.createElement('div'); if(e.data.method === 'error') l.style.color = 'var(--alert-red)';
            l.textContent = `[${e.data.method.toUpperCase()}] ${e.data.content}`;
            const logArea = document.getElementById('console-log-area'); logArea.appendChild(l); logArea.scrollTop = logArea.scrollHeight;
        }
    });

    window.closeRunner = () => { document.getElementById('runner-modal').style.display = 'none'; document.getElementById('runner-frame').srcdoc = ''; };
    window.copyCode = (b64, btn) => { navigator.clipboard.writeText(fromB64(b64)); btn.innerHTML = ICON_CHECK; setTimeout(()=> btn.innerHTML = ICON_COPY, 1500); };
    window.handleButtonClick = () => { if(isGenerating) { isStopped = true; if(abortController) abortController.abort(); } else sendMessage(); };

    /* ============================================================
       SIDEBAR & SETTINGS LOGIC
    ============================================================ */

    function renderChatList() {
        const meta = loadMeta().sort((a,b)=>b.lastModified-a.lastModified);
        const activeId = getActiveChatId();
        chatListEl.innerHTML = '';
        meta.forEach(m => {
            const item = document.createElement('div');
            item.className = 'chat-item' + (m.id === activeId ? ' active' : '');
            item.onclick = () => switchChat(m.id);
            const title = document.createElement('div');
            title.className = 'chat-title';
            title.textContent = m.title || 'Untitled Chat';
            const actions = document.createElement('div');
            actions.className = 'chat-actions';
            const editBtn = createIconBtn(ICON_EDIT, (e) => {
                const newName = prompt('Rename chat', m.title || '');
                if (newName !== null) { m.title = newName.trim() || 'Untitled Chat'; saveMeta(meta); renderChatList(); }
            });
            const delBtn = createIconBtn(ICON_DELETE, () => {
                confirmAction = () => { deleteChat(m.id); const remaining = loadMeta(); if (!remaining.length) switchChat(createNewChat()); else if (getActiveChatId() === m.id) switchChat(remaining[0].id); else renderChatList(); };
                showPrompt("DANGER", "Delete chat?");
            }, true);
            actions.appendChild(editBtn); actions.appendChild(delBtn);
            item.appendChild(title); item.appendChild(actions); chatListEl.appendChild(item);
        });
    }

    function switchChat(id) {
        if (isGenerating) return;
        setActiveChatId(id);
        history = loadChatContent(id);
        loadHistory();
        renderChatList();
        if (window.innerWidth <= 600) hideSidebar();
    }

    function openSettings() {
        settingsModelSelect.value = currentModel;
        settingsStyleSelect.value = currentStyle;
        settingsFontSelect.value = currentFontSize;
        settingsModal.style.display = 'flex';
    }
    function closeSettings() { settingsModal.style.display = 'none'; }
    settingsBtn.onclick = openSettings;
    settingsModelSelect.onchange = () => { currentModel = settingsModelSelect.value; localStorage.setItem('zchat:model', currentModel); };
    settingsStyleSelect.onchange = () => { applyStyle(settingsStyleSelect.value); };
    settingsFontSelect.onchange = () => { applyFontSize(settingsFontSelect.value); };

    clearAllHistoryBtn.onclick = () => {
        confirmAction = () => { const meta = loadMeta(); meta.forEach(m => localStorage.removeItem(CHAT_PREFIX + m.id)); localStorage.removeItem(CHAT_META_KEY); switchChat(createNewChat()); closeSettings(); };
        showPrompt("DANGER", "Erase all history?");
    };

    function showSidebar() { sidebar.classList.remove('hidden'); document.getElementById('app').classList.remove('expanded'); }
    function hideSidebar() { sidebar.classList.add('hidden'); document.getElementById('app').classList.add('expanded'); }
    sidebarToggle.onclick = () => { sidebar.classList.contains('hidden') ? showSidebar() : hideSidebar(); };
    newChatBtn.onclick = () => { if (isGenerating) return; switchChat(createNewChat()); if (window.innerWidth <= 600) hideSidebar(); };

    window.onload = () => {
        applyStyle(currentStyle);
        applyFontSize(currentFontSize);
        currentModel = localStorage.getItem('zchat:model') || currentModel;
        const id = ensureInitialChat();
        history = loadChatContent(id);
        loadHistory();
        renderChatList();
        if (window.innerWidth > 600) showSidebar(); else hideSidebar();
    };
</script>
</body>
</html>
