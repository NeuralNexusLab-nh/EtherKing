<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Sign in - EtherKing</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="https://nexacaptcha.zone.id/captcha.js" defer></script>
  <script src="/assets/auth.js" defer></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a class="brand" href="/" aria-label="EtherKing home">
      <span class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect class="logo-frame" x="2.5" y="2.5" width="27" height="27" rx="9"/><path class="logo-core" d="m16 6.8 2.5 6.7 6.7 2.5-6.7 2.5-2.5 6.7-2.5-6.7L6.8 16l6.7-2.5L16 6.8Z"/><circle class="logo-center" cx="16" cy="16" r="2.35"/></svg>
      </span>
      <span>EtherKing</span>
    </a>
    <button class="icon-button theme-toggle" type="button" aria-label="Use dark theme" title="Use dark theme">
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 15.56-1.42-1.42m0-12.72 1.42-1.42M4.22 19.78l1.42-1.42M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
      <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
    </button>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-heading">
        <span class="brand-logo brand-logo-large" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect class="logo-frame" x="2.5" y="2.5" width="27" height="27" rx="9"/><path class="logo-core" d="m16 6.8 2.5 6.7 6.7 2.5-6.7 2.5-2.5 6.7-2.5-6.7L6.8 16l6.7-2.5L16 6.8Z"/><circle class="logo-center" cx="16" cy="16" r="2.35"/></svg>
        </span>
        <h1 id="auth-title">Welcome back</h1>
        <p id="auth-subtitle">Sign in to continue your conversations.</p>
      </div>

      <div class="auth-tabs" role="tablist" aria-label="Account action">
        <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true" aria-controls="login-form">Sign in</button>
        <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form">Create account</button>
      </div>

      <div id="auth-alert" class="form-alert" role="alert" hidden></div>

      <form id="login-form" class="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" maxlength="128" placeholder="Your password" required>
        </label>
        <button class="primary-button submit-button" type="submit">Continue</button>
      </form>

      <form id="register-form" class="auth-form" novalidate hidden>
        <label class="field">
          <span>Name</span>
          <input name="displayName" type="text" autocomplete="name" minlength="2" maxlength="60" placeholder="How should we address you?" required>
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="At least 12 characters" required>
          <small>Use at least 12 characters with a letter and a number.</small>
        </label>
        <button class="primary-button submit-button" type="submit">Create account</button>
      </form>

      <p class="auth-footnote">Your chats are encrypted in transit and stored with your account.</p>
    </section>
  </main>

  <dialog id="captcha-dialog" class="dialog captcha-dialog">
    <div class="dialog-card">
      <div class="dialog-header">
        <div><h2>Human verification</h2><p>Complete this check to continue.</p></div>
        <button id="captcha-cancel" class="icon-button" type="button" aria-label="Cancel verification">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="captcha-mount" class="captcha-mount"></div>
      <div id="captcha-alert" class="form-alert" role="alert" hidden></div>
    </div>
  </dialog>
</body>
</html>
